<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aevon — Custom Business Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #09090B;
      --bg2:      #0A0F1E;
      --bg3:      #0F1629;
      --bg4:      #141d35;
      --border:   rgba(99,102,241,0.12);
      --border2:  rgba(99,102,241,0.25);
      --accent:   #6366F1;
      --accent2:  #7C3AED;
      --accent-glow: rgba(99,102,241,0.22);
      --accent-dim:  rgba(99,102,241,0.1);
      --text:     #F8FAFC;
      --text2:    #94A3B8;
      --text3:    #475569;
      --r:        10px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(99,102,241,0.25); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Progress bar */
    #progress-bar {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 200;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%; transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .container { max-width: 1120px; margin: 0 auto; padding: 0 40px; }

    /* Fade-in animation */
    .fi { opacity: 0; transform: translateY(20px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .fi.vis { opacity: 1; transform: none; }

    /* ──────────── NAV ──────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 62px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
      border-bottom: 1px solid transparent;
    }
    nav.scrolled {
      background: rgba(9,9,11,0.8);
      backdrop-filter: blur(20px);
      border-color: var(--border);
    }
    .nav-logo {
      font-size: 17px; font-weight: 750; letter-spacing: -0.04em;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.02em;
    }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--text2); text-decoration: none; font-size: 13.5px; font-weight: 500;
      transition: color 0.2s; letter-spacing: -0.01em;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: var(--accent) !important; color: #fff !important;
      padding: 8px 18px; border-radius: 7px; font-weight: 600 !important; font-size: 13px !important;
      transition: opacity 0.2s !important; box-shadow: 0 0 20px rgba(99,102,241,0.3);
      white-space: nowrap;
    }
    .nav-cta:hover { opacity: 0.85; }

    /* ──────────── HERO ──────────── */
    .hero {
      min-height: 100vh; padding: 140px 40px 80px;
      display: flex; align-items: center;
      position: relative; overflow: hidden;
    }
    /* Mesh gradient blobs */
    .hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 70% 40%, rgba(99,102,241,0.09) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 70%, rgba(124,58,237,0.06) 0%, transparent 70%);
    }
    .hero-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 30%, black 20%, transparent 100%);
    }
    .hero-inner {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
      max-width: 1120px; margin: 0 auto; width: 100%;
    }
    .hero-left {}
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 100px; padding: 5px 14px 5px 10px;
      font-size: 11.5px; font-weight: 600; color: #a5b4fc;
      letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 28px;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: bdot 2s infinite;
    }
    @keyframes bdot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .hero h1 {
      font-size: clamp(34px, 3.8vw, 58px);
      font-weight: 800; line-height: 1.1; letter-spacing: -0.04em;
      margin-bottom: 26px; text-wrap: balance;
    }
    .hero h1 .grad {
      background: linear-gradient(130deg, #a5b4fc 0%, #c4b5fd 50%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-sub {
      font-size: 17px; color: var(--text2); line-height: 1.7;
      margin-bottom: 36px; max-width: 480px; text-wrap: balance;
    }
    .hero-ctas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn-pri {
      background: var(--accent); color: #fff;
      padding: 13px 26px; border-radius: 8px; font-size: 14.5px; font-weight: 600;
      border: none; cursor: pointer; font-family: 'Inter', sans-serif;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: -0.01em;
      box-shadow: 0 0 32px rgba(99,102,241,0.35);
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-pri:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 40px rgba(99,102,241,0.5); }
    .btn-sec {
      background: transparent; color: var(--text2);
      border: 1px solid rgba(255,255,255,0.1); padding: 13px 26px; border-radius: 8px;
      font-size: 14.5px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: -0.01em; transition: all 0.2s;
    }
    .btn-sec:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: rgba(255,255,255,0.18); }
    .hero-trust { font-size: 12.5px; color: var(--text3); letter-spacing: 0.01em; }

    /* ── Hero Dashboard Visual ── */
    .hero-right { position: relative; }
    .dashboard-wrap {
      position: relative;
      transform: perspective(1200px) rotateY(-8deg) rotateX(3deg);
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }
    .dashboard-wrap:hover {
      transform: perspective(1200px) rotateY(-4deg) rotateX(1deg);
    }
    .dashboard {
      background: var(--bg2);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,102,241,0.1), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .db-header {
      background: var(--bg3); border-bottom: 1px solid var(--border);
      padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    }
    .db-dots { display: flex; gap: 6px; }
    .db-dot { width: 10px; height: 10px; border-radius: 50%; }
    .db-dot:nth-child(1) { background: #FF5F57; }
    .db-dot:nth-child(2) { background: #FFBD2E; }
    .db-dot:nth-child(3) { background: #28C840; }
    .db-title { font-size: 12px; color: var(--text3); font-weight: 500; margin-left: 4px; }
    .db-body { padding: 20px; }
    .db-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .db-metric {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 9px; padding: 14px;
    }
    .db-metric-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .db-metric-val { font-size: 22px; font-weight: 750; letter-spacing: -0.04em; color: var(--text); }
    .db-metric-delta { font-size: 10px; color: #4ade80; font-weight: 600; margin-top: 2px; }
    .db-chart { background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 14px; margin-bottom: 14px; }
    .db-chart-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .db-bars { display: flex; align-items: flex-end; gap: 5px; height: 52px; }
    .db-bar {
      flex: 1; border-radius: 3px 3px 0 0;
      background: linear-gradient(to top, var(--accent), var(--accent2));
      opacity: 0.7; transition: opacity 0.2s;
      animation: barGrow 0.8s ease forwards;
      transform-origin: bottom;
    }
    .db-bar:nth-child(7) { opacity: 1; box-shadow: 0 0 10px rgba(99,102,241,0.4); }
    @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .db-feed { display: flex; flex-direction: column; gap: 7px; }
    .db-feed-item {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px;
      font-size: 11px;
    }
    .db-feed-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .db-feed-text { color: var(--text2); flex: 1; }
    .db-feed-time { color: var(--text3); }
    .db-live-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2);
      border-radius: 100px; padding: 3px 9px; font-size: 10px; font-weight: 600;
      color: #4ade80; margin-left: auto;
    }
    .db-live-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: bdot 1.5s infinite; }
    /* Floating notification */
    .db-notif {
      position: absolute; bottom: -16px; right: -20px;
      background: var(--bg3); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 10px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      min-width: 200px;
      animation: floatNotif 3s ease-in-out infinite;
    }
    @keyframes floatNotif {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .db-notif-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent-dim); display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .db-notif-title { font-size: 11.5px; font-weight: 600; color: var(--text); }
    .db-notif-sub { font-size: 10.5px; color: var(--text2); }

    /* ──────────── SECTION BASE ──────────── */
    section { padding: 110px 0; }
    .sec-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .sec-label::before { content: ''; display: block; width: 20px; height: 1px; background: var(--accent); }
    .sec-title {
      font-size: clamp(28px, 3.5vw, 44px); font-weight: 800;
      letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 18px; text-wrap: balance;
    }
    .sec-sub { font-size: 17px; color: var(--text2); line-height: 1.7; text-wrap: balance; }

    /* ──────────── PROBLEM ──────────── */
    .problem { border-top: 1px solid var(--border); }
    .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 100px; align-items: center; }
    .problem-left {}
    .prob-items { margin-top: 36px; display: flex; flex-direction: column; gap: 0; }
    .prob-item {
      display: flex; gap: 18px; align-items: flex-start;
      padding: 20px 0; border-bottom: 1px solid var(--border);
      transition: opacity 0.2s; cursor: default;
    }
    .prob-item:last-child { border-bottom: none; }
    .prob-num {
      font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em;
      padding-top: 3px; flex-shrink: 0; width: 24px;
    }
    .prob-item h4 { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 4px; }
    .prob-item p { font-size: 13.5px; color: var(--text2); line-height: 1.6; }
    /* Right side: terminal-style widget */
    .prob-right {}
    .terminal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .term-header {
      background: var(--bg3); padding: 12px 18px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .term-dots { display: flex; gap: 6px; }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; }
    .term-dot:nth-child(1) { background: #FF5F57; }
    .term-dot:nth-child(2) { background: #FFBD2E; }
    .term-dot:nth-child(3) { background: #28C840; }
    .term-name { font-size: 11.5px; color: var(--text3); margin-left: 6px; font-weight: 500; }
    .term-body { padding: 22px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12.5px; line-height: 1.9; }
    .term-line { display: flex; gap: 10px; }
    .term-prompt { color: var(--accent); opacity: 0.7; flex-shrink: 0; }
    .term-cmd { color: #c4b5fd; }
    .term-out { color: var(--text2); padding-left: 20px; }
    .term-err { color: #f87171; padding-left: 20px; }
    .term-ok { color: #4ade80; padding-left: 20px; }
    .term-cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

    /* ──────────── SERVICES ──────────── */
    .services { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .services-head { text-align: center; margin-bottom: 64px; }
    .services-head .sec-label { justify-content: center; }
    .services-head .sec-label::before { display: none; }
    .services-head .sec-sub { max-width: 520px; margin: 0 auto; }
    .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .svc-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px;
      position: relative; overflow: hidden;
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
      cursor: default;
    }
    .svc-card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.4), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .svc-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(99,102,241,0.1); }
    .svc-card:hover::after { opacity: 1; }
    .svc-tag {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
      display: flex; align-items: center; gap: 7px;
    }
    .svc-tag::before { content: ''; display: block; width: 16px; height: 1px; background: var(--accent); }
    .svc-card h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
    .svc-card p { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 20px; }
    .svc-features { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .svc-features li { font-size: 12.5px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
    .svc-features li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* ──────────── ROI CALCULATOR ──────────── */
    .roi { border-top: 1px solid var(--border); }
    .roi-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .roi-left {}
    .roi-left .sec-sub { margin-bottom: 0; }
    .roi-calc {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px;
    }
    .roi-sliders { display: flex; flex-direction: column; gap: 28px; margin-bottom: 28px; }
    .roi-slider-group label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 12px; letter-spacing: -0.01em;
    }
    .roi-slider-group label span {
      font-size: 14px; font-weight: 700; color: var(--accent);
    }
    input[type=range] {
      width: 100%; height: 4px; border-radius: 2px; appearance: none;
      background: var(--bg3); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
      box-shadow: 0 0 12px rgba(99,102,241,0.5);
    }
    input[type=range]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
    }
    .roi-divider { border: none; border-top: 1px solid var(--border); margin-bottom: 24px; }
    .roi-result-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 6px; }
    .roi-result-num {
      font-size: 42px; font-weight: 800; letter-spacing: -0.05em;
      color: var(--accent); line-height: 1; margin-bottom: 8px;
    }
    .roi-result-sub { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .roi-payback {
      margin-top: 16px; background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.15);
      border-radius: 8px; padding: 12px 16px;
      font-size: 13px; color: #86efac; font-weight: 500;
    }

    /* ──────────── HOW IT WORKS ──────────── */
    .how { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .how-head { text-align: center; margin-bottom: 72px; }
    .how-head .sec-label { justify-content: center; }
    .how-head .sec-label::before { display: none; }
    .how-head .sec-sub { max-width: 480px; margin: 0 auto; }
    .how-steps { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; gap: 24px; }
    .how-steps::before {
      content: ''; position: absolute;
      top: 27px; left: calc(12.5% + 26px); right: calc(12.5% + 26px);
      height: 1px;
      background: linear-gradient(90deg, var(--border2), rgba(99,102,241,0.08), var(--border2));
    }
    .how-step { padding: 0 12px; text-align: center; }
    .step-circle {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px; position: relative; z-index: 1;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .step-circle:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,0.3); }
    .step-circle span { font-size: 13px; font-weight: 700; color: var(--accent); }
    .how-step h3 { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; }
    .how-step p { font-size: 13px; color: var(--text2); line-height: 1.65; }

    /* ──────────── PRICING ──────────── */
    .pricing { border-top: 1px solid var(--border); }
    .pricing-head { text-align: center; margin-bottom: 64px; }
    .pricing-head .sec-label { justify-content: center; }
    .pricing-head .sec-label::before { display: none; }
    .pricing-head .sec-sub { max-width: 480px; margin: 0 auto; }

/* ── hooks ── */
function useScrollEffects() {
  React.useEffect(() => {
    // Progress bar
    const bar = document.getElementById('progress-bar');
    const nav = document.getElementById('main-nav');
    const onScroll = () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      bar.style.width = pct + '%';
      if (window.scrollY > 40) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  React.useEffect(() => {
    const els = document.querySelectorAll('.fi');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const d = parseInt(e.target.dataset.delay || 0);
          setTimeout(() => e.target.classList.add('vis'), d);
        }
      });
    }, { threshold: 0.1 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ── Animated counter ── */
function AnimCount({ target, prefix = '', suffix = '' }) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef();
  React.useEffect(() => {
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      let start = 0;
      const step = target / 40;
      const interval = setInterval(() => {
        start += step;
        if (start >= target) { setVal(target); clearInterval(interval); }
        else setVal(Math.floor(start));
      }, 30);
    }, { threshold: 0.5 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, [target]);
  return <span ref={ref}>{prefix}{val.toLocaleString()}{suffix}</span>;
}

/* ── Contact Form ── */
function ContactForm() {
  const [fields, setFields] = React.useState({ name: '', email: '', need: '', message: '' });
  const [errors, setErrors] = React.useState({});
  const [state, setState] = React.useState('idle'); // idle | loading | success

  const set = k => e => setFields(f => ({ ...f, [k]: e.target.value }));

  const validate = () => {
    const e = {};
    if (!fields.name.trim()) e.name = true;
    if (!fields.email.match(/\S+@\S+\.\S+/)) e.email = true;
    if (!fields.need) e.need = true;
    return e;
  };

  const submit = ev => {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    setState('loading');
    setTimeout(() => setState('success'), 1500);
  };

  if (state === 'success') {
    return (
      <div className="cf-success">
        <div className="cf-success-ring">✓</div>
        <h3>You're in the queue.</h3>
        <p style={{ color: 'var(--text2)', fontSize: 14 }}>We'll reach out within one business day to schedule a 30-minute discovery call.</p>

    );

  const err = k => errors[k] ? 'cf-err' : '';

  return (
    <form onSubmit={submit} noValidate>

          <div className="cf-group">

          {state === 'loading' ? 'Sending…' : 'Send Message →'}
        </button>
        <p className="cf-note">No pressure. No spam. Just a conversation about your workflow.</p>
